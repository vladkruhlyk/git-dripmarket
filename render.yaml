services:
  - type: web
    name: dripmarket
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SANITY_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_SANITY_DATASET
        value: production
      - key: NEXT_PUBLIC_SANITY_API_VERSION
        value: 2025-02-19
      - key: SANITY_REVALIDATE_SECRET
        generateValue: true
      - key: WAYFORPAY_MERCHANT_ACCOUNT
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false
      - key: WAYFORPAY_DOMAIN
        sync: false
